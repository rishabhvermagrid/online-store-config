server:
  port: 8089

spring:
  application:
    name: product-service

resilience4j:
  circuitbreaker:
    instances:
      productDependencies:
        sliding-productDependencies-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
          # 404 Not Found ko circuit breaker failure mat maano:
        ignore-exceptions:
          - feign.FeignException.NotFound
          - com.rishabh.store.product.exception.ProductUnavailableException

  retry:
    instances:
      productDependencies:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        #Dont waste retries on 404 or out of stock items:
        ignore-exceptions:
          - feign.FeignException.NotFound
          - com.rishabh.store.product.exception.ProductUnavailableException