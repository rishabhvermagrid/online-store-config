server:
  port: 8089

spring:
  application:
    name: product-service

resilience4j:
  # 1. Put Circuit Breaker on the outside (lower number = higher priority)
  circuitbreaker:
    circuit-breaker-aspect-order: 1
    instances:
      productDependencies:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        # 404 Not Found ko circuit breaker failure mat maano:
        ignore-exceptions:
          - feign.FeignException.NotFound
          - com.rishabh.store.product.exception.ProductUnavailableException

  # 2. Put Retry on the inside & ignore CallNotPermittedException
  retry:
    retry-aspect-order: 2
    instances:
      productDependencies:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        # Dont waste retries on 404 or out of stock items:
        ignore-exceptions:
          - feign.FeignException.NotFound
          - com.rishabh.store.product.exception.ProductUnavailableException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException